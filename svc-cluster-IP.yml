apiVersion: v1
kind: Service
metadata:
  name: portofolio-app-service
spec:
  type: NodePort
  selector:
    app: portofolio-app
  ports:
    - port: 5000
      targetPort: 5000
      nodeport: 31254
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
